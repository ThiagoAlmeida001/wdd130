<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Poll Activity</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
    <header>        
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <h1>Contact Information</h1>
        <form>
            <div class="form-item column2">

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-item column2">

                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>            
            </div>
        </form>
        <h1>Questions</h1>
        <form>
            <div class="form-item column1">

                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="1">Chrome</option>
                    <option value="2">Safari</option>
                    <option value="3">Edge</option>
                    <option value="3">Brave</option>
                    <option value="3">Other</option>
                </select>
            </div>
            <div class="form-item column1">

                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="form-item">

                <label for="feedback">List the places you have lived.</label>
                <textarea placeholder="stillwater Florida, Amsterdam Netherlands, Tumbuktu Mali" name="feedback" id="feedback" rows="4"></textarea>
            </div>
                
            <button type="submit">Submit Poll</button>
        </form>
        
    </main>
    <footer>
        <p>&copy;2026 | HTML Form - User Poll Activity 🎶 Thiago Almeida 🎶 Santiago, Chile</p>
    </footer>
</body>
</html>
