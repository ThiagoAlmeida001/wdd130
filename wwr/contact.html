<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="contact us page from my Aqua Force Rafting Site Project. ">
    <meta name="author" content="Thiago da Silva Almeida">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Aqua Force Rafting logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact_us">
            <h1>Aqua Force Rafting</h1>
            <p>2159 San Miguel Dr</p>
            <p>Walnut Creek, California</p>
            <p>+1 999 999 9999</p>
            <p>info@aquaforce.com</p>
        </div>
        <div class="grid">
            
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3148.8212783248264!2d-122.0442962235832!3d37.88786210563671!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808561d57f20676f%3A0x1dff3d71dee1ab5!2s2159%20San%20Miguel%20Dr%2C%20Walnut%20Creek%2C%20CA%2094596%2C%20EUA!5e0!3m2!1spt-BR!2scl!4v1785635180876!5m2!1spt-BR!2scl" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            
            <form action="#">
                <div class="form-row">
                    <label for="fullname">Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Cena" required>
                </div>

                <div class="form-row">
                    
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" placeholder="xxxx@domin.com" required>            
                </div>

                <div class="radio-container">
                    <span class="radio-title">Message Purpose</span>
                    
                    <div class="radio-options">
                        <label>
                            <input type="radio" name="purpose" value="general" checked>
                            General Inquiry
                        </label>
                        
                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        
                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                    
                </div>
                <div class="form-row-vertical">
                    <label for="message">Message</label>
                    <textarea placeholder="Type here" name="message" id="message" rows="4"></textarea>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please Subscribe me to the monthyly newsletter</label>
                </div>
                
                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="imagens-container">
                <figure>
                    <img src="images/fig01.jpg"
                      alt="Portrait of Liam Smith, Rafting Guide" />
                    <figcaption>Liam Smith</figcaption>
                </figure>
                <figure>
                    <img src="images/fig02.jpg"
                      alt="Portrait of Oliver Jones, Safety Kayaker" />
                    <figcaption>Oliver Jones</figcaption>
                </figure>
                <figure>
                    <img src="images/fig03.jpg"
                      alt="Emma Johnson, Trip Coordinator, smiling outdoors" />
                    <figcaption>Emma Johnson</figcaption>
                </figure>
            </div>

        </section>
    </main>
    <footer>
        <p>&copy;2026 💦 Aqua Force Rafting 💦 Thiago Almeida</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/">
                <img src="images/instagram-square.svg" alt="Instagram Icon">
            </a>
            <a href="https://www.tiktok.com/">
                <img src="images/tictok-bw.svg" alt="Tiktok Icon">
            </a>
            <a href="https://x.com">
                <img src="images/x-bw.svg" alt="X Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
